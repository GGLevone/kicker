<style>
:root{--bg:#FFFFFF;--card:#F3F2EE;--card2:#E9E7E1;--line:#E6E4DE;--tx:#1E1F21;--mu:#8E8C86;--acc:#D9533F;--blue:#4F6D8A;--blue2:#EBEFF3;--red:#D9533F;--red2:#F9E9E5;--ink:#1E1F21;--ok:#4F8A5E;--num:Oswald,"Arial Narrow",sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 Manrope,-apple-system,system-ui,Roboto,sans-serif;padding-bottom:104px}
header{padding:18px 18px 4px;display:flex;align-items:center;gap:8px}
header h1{font:600 26px/1 var(--num);text-transform:uppercase;letter-spacing:.5px;margin:0}
.ib{width:38px;height:38px;border-radius:50%;border:0;background:var(--card);color:var(--ink);display:grid;place-items:center;cursor:pointer;padding:0}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
nav{position:fixed;left:14px;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));max-width:520px;margin:0 auto;display:flex;gap:4px;background:var(--ink);border-radius:28px;padding:5px;z-index:5;box-shadow:0 8px 24px rgba(30,31,33,.18)}
nav button{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;background:none;border:0;color:#9D9C98;padding:12px 8px;border-radius:23px;font:inherit;font-size:14px;font-weight:700;cursor:pointer;transition:flex .2s,background .2s}
nav button span{display:none}
nav button.on{flex:2.4;background:#FFFFFF;color:var(--ink)}nav button.on span{display:inline}
main{padding:0 16px;max-width:720px;margin:0 auto}
h2{font:600 30px/1.1 var(--num);text-transform:uppercase;letter-spacing:.4px;margin:16px 0 10px}h3{font-size:15px;font-weight:700;margin:0 0 10px}
.card{background:var(--card);border-radius:22px;padding:16px;margin:10px 0}
.row{display:flex;gap:8px;align-items:center}.between{justify-content:space-between}.grow{flex:1;min-width:0}
.muted{color:var(--mu)}small{display:block;color:var(--mu);font-size:12px;margin-top:1px;font-weight:400}
.hint{color:var(--mu);font-size:13px}
.list{padding:4px 16px}.list .li{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line);cursor:pointer;font-weight:600}
.list .li:last-child{border:0}.list .li b{font:600 20px var(--num);font-variant-numeric:tabular-nums}
.rank{width:26px;font:600 17px var(--num);color:var(--mu);flex:none}.rank.top0{color:var(--acc)}
.lead{background:var(--ink);color:#F7F6F3;border-radius:22px;padding:18px;margin:10px 0;display:flex;align-items:center;gap:12px;cursor:pointer}
.lead .nm{font:600 30px/1 var(--num);text-transform:uppercase;letter-spacing:.3px}.lead .lrt{font:600 26px var(--num);color:#B9B7B0;margin-top:2px}
.ring{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font:600 15px var(--num);flex:none}
input,select,textarea{background:#FFFFFF;color:var(--tx);border:1px solid var(--line);border-radius:14px;padding:12px;font:inherit;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--ink)}
label{display:block;margin:0 0 12px;color:var(--mu);font-size:13px}label input,label select{margin-top:5px}
.tog{display:flex;gap:6px;align-items:center;margin:0}.tog input{width:auto;margin:0;accent-color:var(--ink)}
.btn{display:block;width:100%;background:var(--acc);color:#fff;border:0;border-radius:18px;padding:15px;font:inherit;font-size:16px;font-weight:700;margin-top:10px;cursor:pointer}
.btn.ghost{background:var(--card);color:var(--ink)}.btn.dark{background:var(--ink);color:#fff}.btn.danger{background:transparent;color:var(--red);border:1.5px solid var(--red2)}
.mini{background:var(--card);color:var(--ink);border:0;border-radius:14px;padding:8px 13px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.card .mini,.sheet .card .mini{background:#FFFFFF}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chip{background:#FFFFFF;color:var(--tx);border:1px solid var(--line);border-radius:20px;padding:9px 14px;font:inherit;font-size:14px;font-weight:600;cursor:pointer}
.chip small{display:inline;margin-left:4px;font-size:11px}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.seg{display:flex;gap:20px;border-bottom:1px solid var(--line);margin-bottom:12px}
.seg button{border:0;background:none;color:var(--mu);padding:9px 0;font:inherit;font-size:14px;font-weight:700;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.seg button.on{color:var(--ink);border-color:var(--acc)}
.match{display:flex;gap:8px;align-items:stretch}
.vs{align-self:center;color:var(--mu);font:500 14px var(--num)}
.team{flex:1;border-radius:20px;padding:12px;min-width:0;background:#FFFFFF}
.tl{font-weight:700;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;font-size:14px}.team.blue .tl{color:var(--blue)}.team.red .tl{color:var(--red)}
.chance{color:var(--mu);font:500 14px var(--num)}
.pl{margin-bottom:8px}.role{display:block;font-size:11px;color:var(--mu);margin-bottom:3px;text-transform:uppercase;letter-spacing:.5px;font-weight:600}
.pl select{padding:9px;font-size:14px;font-weight:600;background:var(--card);border-color:transparent}.pl .row{gap:6px}
.pgi{width:58px;flex:none;padding:9px;text-align:center;font-size:14px;background:var(--card);border-color:transparent}
.score::placeholder{font:500 18px Manrope,sans-serif;color:#B9B7B0;text-transform:none}.score{margin-top:8px;font:500 34px var(--num);text-align:center;padding:6px;background:var(--card);border-color:transparent;border-radius:16px}
.team.blue .score{color:var(--blue)}.team.red .score{color:var(--red)}
.team .mini{width:100%;margin-top:2px;background:var(--card)}
.err{color:var(--red);font-size:13px;min-height:4px}
table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
th{color:var(--mu);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.4px;text-align:right;padding:4px}th:first-child,td:first-child{text-align:left}
td{padding:9px 4px;border-top:1px solid var(--line);text-align:right;font-weight:500}td:first-child{font-weight:700}
.pos{color:var(--ok);font-family:var(--num);font-weight:600}.neg{color:var(--red);font-family:var(--num);font-weight:600}
.game{display:flex;align-items:center;gap:8px;padding:11px 0;border-top:1px solid var(--line);font-size:13px}
.game .s{font:600 18px var(--num);white-space:nowrap}.w{color:var(--ink);font-weight:700}.lo{color:var(--mu)}
.banner{background:var(--ink);color:#B9B7B0;border-radius:22px;padding:18px;margin:10px 0;text-align:center;font-size:13px}
.banner b{color:#fff;font:600 30px/1.15 var(--num);text-transform:uppercase;letter-spacing:.3px;display:block;margin:4px 0}.banner small{color:#9D9C98}
.banner .mini{background:#2E3033;color:#fff}
.ev{display:inline-flex;align-items:center;gap:6px}
.ev i{width:26px;height:26px;border-radius:9px;display:inline-grid;place-items:center;background:var(--acc);color:#fff;font-style:normal}
.bracket{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px}
.round{min-width:190px;display:flex;flex-direction:column;justify-content:space-around;gap:8px}
.rt{color:var(--mu);font-size:11px;text-align:center;text-transform:uppercase;letter-spacing:.5px;font-weight:700}
.bm{background:#FFFFFF;border-radius:16px;padding:10px;font-size:13px}
.bm .t{display:flex;justify-content:space-between;padding:3px 0}.bm .t b{font-family:var(--num)}.bm .t.win{color:var(--acc);font-weight:700}
.bm .mini{margin-top:6px;width:100%;background:var(--card)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.stat{background:var(--card);border-radius:18px;padding:12px 6px;text-align:center}.stat b{display:block;font:600 24px var(--num)}.stat span{font-size:11px;color:var(--mu);font-weight:600}
.spark{width:100%;height:60px}
.aw{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}.aw:first-of-type{border-top:0}
.bar{width:5px;height:32px;border-radius:3px;background:#C9C6BE;flex:none}.bar.top{background:var(--ink)}
.modal{position:fixed;inset:0;background:rgba(30,31,33,.35);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.modal.hidden{display:none}
.sheet{background:var(--bg);width:100%;max-width:720px;max-height:88vh;overflow:auto;border-radius:28px 28px 0 0;padding:20px 18px 30px}
.tag{display:inline-block;font-size:11px;font-weight:700;background:var(--card);border-radius:8px;padding:2px 8px;margin-left:6px;color:var(--mu);vertical-align:middle}
.empty{text-align:center;color:var(--mu);padding:48px 10px}.empty b{color:var(--ink);font:600 22px var(--num);text-transform:uppercase}
</style>

<body>
<header><h1>Кикер</h1><span class="muted grow" id="sub"></span><span class="muted" id="sync" style="font-size:12px"></span><button class="ib" data-act="pullNow" aria-label="Обновить" id="bref"></button><button class="ib" data-act="tab" data-tab="more" aria-label="Настройки" id="bset"></button></header>
<main id="app"></main>
<nav>
<button data-act="tab" data-tab="rating" aria-label="Рейтинг"><svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 21h8M12 17v4M7 4h10M17 4v8a5 5 0 0 1-10 0V4"/><circle cx="5" cy="9" r="2"/><circle cx="19" cy="9" r="2"/></svg><span>Рейтинг</span></button>
<button data-act="tab" data-tab="session" aria-label="Вечер"><svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21h6a1 1 0 0 0 1-1v-3.6c0-1.4.3-2.8.85-4l.3-.7c.56-1.25.85-2.25.85-3.65V4a1 1 0 0 0-1-1H7a1 1 0 0 0-1 1v4c0 1.4.3 2.4.85 3.65l.3.7A10 10 0 0 1 8 16.4V20a1 1 0 0 0 1 1zM6 8h12"/></svg><span>Вечер</span></button>
<button data-act="tab" data-tab="tour" aria-label="Турнир"><svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5h5v4H3zM3 15h5v4H3zM8 7h3v10H8M11 12h3M14 10h6v4h-6z"/></svg><span>Турнир</span></button>
<button data-act="tab" data-tab="players" aria-label="Игроки"><svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="7" r="4"/><path d="M3 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2M16 3.13a4 4 0 0 1 0 7.75M21 21v-2a4 4 0 0 0-3-3.85"/></svg><span>Игроки</span></button>
</nav>
<div id="modal" class="modal hidden"><div class="sheet" id="sheet"></div></div>
<script>
/* ===== НАСТРОЙКА: вставьте сюда URL веб-приложения Apps Script (…/exec) ===== */
const API='https://script.google.com/macros/s/AKfycbxw5GK0VT6rD2zbqMB_E0jFR7zOr_h9nkyTQGr79sCbctTkyXt2RQpcYwAn6CbiaOcHRw/exec';
/* ========================================================================== */
const ONLINE=!!API,LS='kicker_tg_cache',K=32,BASE=1000,COLLS=['players','matches','sessions','tours'];
const blank=()=>({players:[],matches:[],sessions:[],tours:[]});
const strip=o=>JSON.stringify(o,(k,v)=>k[0]==='_'?undefined:v);
function load(){try{const t=localStorage.getItem(LS);if(t)return Object.assign(blank(),JSON.parse(t))}catch(e){}return blank()}
function cacheLocal(){try{localStorage.setItem(LS,strip(S))}catch(e){}}
let ADMIN='',LOADED=!ONLINE,SNAP={},Q=[],FT=null,FLUSHING=false,SYNC='',NEEDRENDER=false;
function snapAll(){SNAP={};COLLS.forEach(c=>{SNAP[c]={};S[c].forEach(o=>SNAP[c][o.id]=strip(o))})}
function save(){cacheLocal();if(!ONLINE)return;
  COLLS.forEach(c=>{const seen={};SNAP[c]=SNAP[c]||{};
    S[c].forEach(o=>{const j=strip(o);seen[o.id]=1;if(SNAP[c][o.id]!==j){SNAP[c][o.id]=j;Q=Q.filter(q=>!(q.c===c&&q.id===o.id));Q.push({op:'put',c,id:o.id,obj:JSON.parse(j)})}});
    Object.keys(SNAP[c]).forEach(id=>{if(!seen[id]){delete SNAP[c][id];Q=Q.filter(q=>!(q.c===c&&q.id===id));Q.push({op:'del',c,id})}})});
  if(Q.length){setSync('wait');clearTimeout(FT);FT=setTimeout(flush,400)}}
async function api(body){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({...body,initData:INITF()})});return r.json()}
async function flush(){if(FLUSHING||!Q.length)return;FLUSHING=true;const ops=Q.slice();let retry=false;
  try{const j=await api({action:'sync',ops});if(!j.ok)throw new Error(j.error);Q=Q.filter(q=>!ops.includes(q));setSync(Q.length?'wait':'ok')}
  catch(e){const a=e.message==='auth';setSync(a?'auth':'err');retry=!a}
  finally{FLUSHING=false;if(retry)setTimeout(flush,5000);else if(Q.length)flush()}}
async function pull(force){if(!ONLINE||Q.length||FLUSHING)return;
  try{if(force)setSync('wait');const r=await fetch(API+'?action=state');const j=await r.json();if(!j.ok)throw 0;if(Q.length||FLUSHING)return;
    ADMIN=String(j.admin||'');const nd=Object.assign(blank(),j.data);
    const changed=COLLS.some(c=>nd[c].length!==Object.keys(SNAP[c]||{}).length||nd[c].some(o=>(SNAP[c]||{})[o.id]!==strip(o)));
    setSync('ok');const first=!LOADED;LOADED=true;if(!changed){if(first)render();return}S=nd;snapAll();cacheLocal();
    const ae=document.activeElement;if(!first&&(MODALFN||(ae&&/INPUT|TEXTAREA|SELECT/.test(ae.tagName)&&!force)))NEEDRENDER=true;else render()}
  catch(e){setSync('err');if(!LOADED){LOADED=true;render()}}}
function setSync(s){SYNC=s;const el=document.getElementById('sync');if(el)el.innerHTML=ONLINE?({ok:'<span class="dot" style="background:#4F8A5E"></span>',wait:'<span class="dot" style="background:#C9C6BE"></span>',err:'<span style="color:#D9533F">нет связи</span>',auth:'<span style="color:#D9533F">откройте через Telegram</span>'}[s]||''):'локально'}
function hashInit(){try{return new URLSearchParams((window.__H||'').slice(1)).get('tgWebAppData')||''}catch(e){return''}}
const INITF=()=>(window.Telegram&&Telegram.WebApp&&Telegram.WebApp.initData)||hashInit();
function TGU(){try{const u=new URLSearchParams(INITF()).get('user');return u?JSON.parse(u):null}catch(e){return null}}
const isAdmin=()=>!ONLINE||!ADMIN||String((TGU()||{}).id)===ADMIN;
const canEdit=p=>isAdmin()||!p.tg||String(p.tg)===String((TGU()||{}).id);
const meP=()=>{const u=TGU();return u?S.players.find(p=>p.tg===u.id):null};
let S=load(),TAB='rating',SEL=new Set(),SHOWG=true,TMODE='teams',FORM={tper:3,ppos:'any'},CONFIRM=null,MODALFN=null,C={R:{},st:{}};
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const P=id=>S.players.find(p=>p.id===id);
const nm=id=>{const p=P(id);return p?p.name:'?'};
const gtag=id=>(P(id)||{}).guest?'<span class="tag">гость</span>':'';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const avg=a=>a.reduce((x,y)=>x+y,0)/a.length;
const ex=(ra,rb)=>1/(1+Math.pow(10,(rb-ra)/400));
const pct=(w,g)=>g?Math.round(100*w/g)+'%':'—';
const sg=d=>`<span class="${d>=0?'pos':'neg'}">${d>=0?'+':''}${Math.round(d)}</span>`;
const fmtDate=ts=>new Date(ts).toLocaleDateString('ru-RU',{day:'numeric',month:'short'});
const IP={crown:'<path d="M4 19h16M5 8l4 4 3-6 3 6 4-4-1.5 10.5h-11z"/>',bolt:'<path d="M13 3L5 14h6l-1 7 8-11h-6z"/>',refresh:'<path d="M20 11a8 8 0 1 0-2.3 5.7M20 4.5V11h-6.5"/>',gear:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.6 1.6 0 0 0-1-1.5 1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.6 1.6 0 0 0 1.5-1 1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/>',pencil:'<path d="M4 20h4L19 9l-4-4L4 16z"/>',swap:'<path d="M7 4v16M4 7l3-3 3 3M17 20V4M14 17l3 3 3-3"/>',star:'<path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.5 2.9 1-6.1L3.2 9.5l6.1-.9z"/>'};
const ic=(n,sz)=>`<svg viewBox="0 0 24 24" width="${sz||18}" height="${sz||18}" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IP[n]}</svg>`;
const evI=(n,t)=>`<span class="ev"><i>${ic(n,15)}</i>${t}</span>`;
const POS={any:'Универсал',atk:'Атака',def:'Защита'};
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

/* ---------- расчёт рейтинга и статистики ---------- */
function calc(){
  const RR={'1':{},'2':{}},SS={'1':{},'2':{}};let R,st;
  const get=id=>st[id]||(st[id]={g:0,w:0,l:0,ag:0,aw:0,dg:0,dw:0,gf:0,ga:0,streak:0,best:0,part:{},hist:[],pg:0,pgn:0,pbest:0});
  for(const k of['1','2']){R=RR[k];st=SS[k];S.players.forEach(p=>{R[p.id]=BASE;get(p.id)})}
  const ms=[...S.matches].sort((x,y)=>x.ts-y.ts);
  for(const m of ms){const k=m.a.length===1?'1':'2';R=RR[k];st=SS[k];
    [...m.a,...m.b].forEach(id=>{if(R[id]==null)R[id]=BASE});
    const ea=ex(avg(m.a.map(i=>R[i])),avg(m.b.map(i=>R[i])));
    const top=Math.max(m.sa,m.sb),mg=Math.abs(m.sa-m.sb),mult=m.mg?1+0.5*Math.max(0,mg-1)/Math.max(1,top-1):1;
    const d=K*mult*((m.sa>m.sb?1:0)-ea);m._d=d;m._ea=ea;
    side(m.a,m.sa,m.sb,d,m);side(m.b,m.sb,m.sa,-d,m);
    if(m.bonus)Object.entries(m.bonus).forEach(([i,v])=>{if(R[i]!=null){R[i]+=v;const h=get(i).hist;if(h.length)h[h.length-1]=Math.round(R[i])}});
  }
  function side(team,f,a,d,m){const won=f>a;team.forEach((id,i)=>{R[id]+=d;const s=get(id);s.g++;if(m.g&&m.g[id]!=null){const v=+m.g[id];s.pg+=v;s.pgn++;s.pbest=Math.max(s.pbest,v)}won?s.w++:s.l++;s.gf+=f;s.ga+=a;
    s.streak=won?(s.streak>0?s.streak+1:1):(s.streak<0?s.streak-1:-1);s.best=Math.max(s.best,s.streak);
    if(team.length===2){if(i===0){s.ag++;if(won)s.aw++}else{s.dg++;if(won)s.dw++}
      const pp=s.part[team[1-i]]||(s.part[team[1-i]]={g:0,w:0});pp.g++;if(won)pp.w++}
    s.hist.push(Math.round(R[id]))})}
  return{R:RR['2'],st:SS['2'],R1:RR['1'],st1:SS['1']};
}

function buildBracket(t){const T=t.teams.length,seed=t.teams.map((_,i)=>i).sort((x,y)=>teamR(t.teams[y])-teamR(t.teams[x]));
  let n=1;while(n<T)n*=2;const sd=seeding(n),r0=[];
  for(let i=0;i<n;i+=2)r0.push({a:sd[i]<=T?seed[sd[i]-1]:null,b:sd[i+1]<=T?seed[sd[i+1]-1]:null,w:null});

  rmode:e=>{RMODE=e.dataset.m;render()},
  pmode:e=>{PMODE=e.dataset.m;refresh()},
  smode:e=>{const s=activeSession();s.manual=e.dataset.m==='manual';if(!s.manual)s.cur=null;save();render()},
  togpg:e=>{const o=getOwner(e.dataset.own);o.pg=!o.pg;save();render()},
  fmt:e=>{const o=getOwner(e.dataset.own),c=o.cur;if(c.a.length===2){c.a=[c.a[0]];c.b=[c.b[0]]}else{const on=new Set([...c.a,...c.b]),r=o.ids.filter(i=>!on.has(i));if(r.length<2)return;c.a.push(r[0]);c.b.push(r[1])}c.g={};save();render()},
  pullNow:()=>{if(ONLINE)pull(true);else render()},
  itsme:e=>{const u=TGU();if(!u)return;P(e.dataset.id).tg=u.id;save();refresh()},
  unme:e=>{delete P(e.dataset.id).tg;save();refresh()},
  sendPic:async e=>{const t=e.textContent;e.disabled=true;e.textContent='Отправляю…';
    try{const img=document.getElementById('sumimg').src.split(',')[1],cap=document.getElementById('sumtxt').value.split('\n').slice(0,2).join('\n');
      const j=await api({action:'photo',to:e.dataset.to,image:img,caption:cap});flash(j.ok?(e.dataset.to==='me'?'Картинка в личке у бота':'Отправлено в чат'):(j.error||'Не получилось'))}
    catch(x){flash('Нет связи')}e.disabled=false;e.textContent=t},
  sendSum:async e=>{e.disabled=true;e.textContent='Отправляю…';try{const j=await api({action:'send',text:document.getElementById('sumtxt').value});flash(j.ok?'Отправлено в чат':(j.error||'Не получилось'))}catch(x){flash('Нет связи')}e.disabled=false;e.textContent='Отправить текстом'},
  reroll:e=>{const o=(e.dataset.kind==='s'?S.sessions:S.tours).find(x=>x.id===e.dataset.id);o.seed=(o.seed||0)+1;save();refresh()},
  copyExp:()=>copy(document.getElementById('exp').value),
  copySum:()=>copy(document.getElementById('sumtxt').value),
  import:()=>{try{const d=JSON.parse(document.getElementById('imp').value);if(!Array.isArray(d.players)||!Array.isArray(d.matches))throw 0;S=Object.assign(blank(),d);save();TAB='rating';render()}catch(x){err('err_imp','Не получилось прочитать копию')}},
  demo:()=>{const names=[['Гор','any'],['Артём','atk'],['Саша','def'],['Миша','atk'],['Дима','any'],['Лёша','def'],['Костя','atk']];
    const ids=names.map(([n,p])=>(S.players.find(x=>x.name===n)||addP(n,false,p)).id);const skill={};ids.forEach((i,k)=>skill[i]=[1.3,1.1,1,1.2,.8,.9,.7][k]);
    let ts=Date.now()-30*864e5;for(let k=0;k<30;k++){const f=shuffle(ids).slice(0,4),a=[f[0],f[1]],b=[f[2],f[3]];
      const pa=(skill[a[0]]+skill[a[1]])/(skill[a[0]]+skill[a[1]]+skill[b[0]]+skill[b[1]]),win=Math.random()<pa,lo=Math.floor(Math.random()*9);
      S.matches.push({id:uid(),ts:ts+=864e5,ctx:{t:'demo',id:'demo'},a,b,sa:win?10:lo,sb:win?lo:10,host:'демо'})}
    save();TAB='rating';render()},
  reset:()=>{if(CONFIRM!=='reset'){CONFIRM='reset';return render()}S=blank();CONFIRM=null;save();render()}
};
const CH={
  showg:e=>{SHOWG=e.checked;render()},
  setto:e=>{const o=getOwner(e.dataset.own);o.to=+e.value;save()},
  setpos:e=>{const o=getOwner(e.dataset.own),c=o.cur,k=e.dataset.k,j=+e.dataset.j,nv=e.value,old=c[k][j];
    for(const kk of['a','b'])c[kk].forEach((x,jj)=>{if(x===nv)c[kk][jj]=old});c[k][j]=nv;save();render()},
  setteam:e=>{const t=activeTour(),ti=+e.dataset.ti,j=+e.dataset.j,nv=e.value,old=t.teams[ti][j];
    t.teams.forEach(tm=>tm.forEach((x,jj)=>{if(x===nv)tm[jj]=old}));t.teams[ti][j]=nv;save();render()}
};
function copy(t){try{navigator.clipboard.writeText(t).then(()=>flash('Скопировано'),()=>flash('Выделите текст и скопируйте вручную'))}catch(x){flash('Выделите текст и скопируйте вручную')}}
function flash(t){const d=document.createElement('div');d.textContent=t;d.style.cssText='position:fixed;top:14px;left:50%;transform:translateX(-50%);background:#43474C;color:#F5F3EE;padding:8px 14px;border-radius:10px;z-index:20;font-weight:600';document.body.appendChild(d);setTimeout(()=>d.remove(),1600)}
function alertBox(t){flash(t)}
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(el){const f=A[el.dataset.act];if(f)f(el);return}if(e.target.id==='modal')closeModal()});
document.addEventListener('input',e=>{const el=e.target;if(el.dataset.f)FORM[el.dataset.f]=el.type==='checkbox'?el.checked:el.value;
  if(el.dataset.pg){const o=getOwner(el.dataset.own);if(o&&o.cur){o.cur.g=o.cur.g||{};if(el.value==='')delete o.cur.g[el.dataset.pg];else o.cur.g[el.dataset.pg]=el.value;save()}}
  if(el.dataset.sc){const o=getOwner(el.dataset.own);if(o&&o.cur){const k=el.dataset.sc,ok=k==='a'?'b':'a',v=parseInt(el.value);o.cur['s'+k]=el.value;
    const other=document.querySelector(`[data-sc="${ok}"][data-own="${el.dataset.own}"]`);
    const to=String(o.to||10);if(v>=0&&v<+to&&other&&other.value===''){other.value=to;o.cur['s'+ok]=to}save()}}});
document.addEventListener('change',e=>{const el=e.target;if(el.dataset.chg&&CH[el.dataset.chg])CH[el.dataset.chg](el)});
try{['600 40px Oswald','400 30px Manrope','600 30px Manrope'].forEach(f=>document.fonts.load(f))}catch(e){}
document.getElementById('bref').innerHTML=ic('refresh',18);document.getElementById('bset').innerHTML=ic('gear',18);snapAll();render();setSync(ONLINE?'wait':'');
window.addEventListener('load',()=>{const w=window.Telegram&&Telegram.WebApp;if(w){try{w.ready();w.expand();w.setHeaderColor('#FFFFFF');w.setBackgroundColor('#FFFFFF')}catch(e){}}render()});
if(ONLINE){pull(true);setInterval(()=>{if(!document.hidden)pull()},15000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)pull()})}
document.addEventListener('focusout',()=>setTimeout(()=>{if(NEEDRENDER&&!MODALFN&&!/INPUT|TEXTAREA|SELECT/.test((document.activeElement||{}).tagName||'')){NEEDRENDER=false;render()}},50));
</script>
</body>
