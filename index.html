<style>
:root{--bg:#0f1115;--card:#181b22;--card2:#20242d;--line:#2a2f3a;--tx:#e8eaf0;--mu:#8a91a3;--acc:#3ddc84;--blue:#4c8dff;--red:#ff5c5c;--gold:#ffc940}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 -apple-system,system-ui,Segoe UI,Roboto,sans-serif;padding-bottom:80px}
header{padding:14px 16px 4px;display:flex;align-items:center;gap:10px}
header h1{font-size:20px;margin:0}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#12151b;border-top:1px solid var(--line);z-index:5}

nav button b{display:block;font-size:19px;font-weight:400}
nav button.on{color:var(--acc)}
main{padding:0 14px;max-width:720px;margin:0 auto}
h2{font-size:19px;margin:14px 0 8px}h3{font-size:16px;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
.row{display:flex;gap:8px;align-items:center}.between{justify-content:space-between}.grow{flex:1;min-width:0}
.muted{color:var(--mu)}small{display:block;color:var(--mu);font-size:12px}
.hint{color:var(--mu);font-size:13px}
.list .li{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer}

input,select,textarea{background:var(--card2);color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:15px;width:100%}

.team .mini{width:100%;margin-top:2px}

.empty{text-align:center;color:var(--mu);padding:40px 10px}

<body>
<header><h1>⚽ Кикер</h1><span class="muted grow" id="sub"></span><span class="muted" id="sync" style="font-size:12px"></span><button class="mini" data-act="pullNow">⟳</button><button class="mini" data-act="tab" data-tab="more">⚙️</button></header>
<main id="app"></main>
<nav>
<button data-act="tab" data-tab="rating"><b>🏆</b>Рейтинг</button>

<button data-act="tab" data-tab="tour"><b>🎯</b>Турнир</button>

<script>
/* ===== НАСТРОЙКА: вставьте сюда URL веб-приложения Apps Script (…/exec) ===== */
const API='https://script.google.com/macros/s/AKfycbxw5GK0VT6rD2zbqMB_E0jFR7zOr_h9nkyTQGr79sCbctTkyXt2RQpcYwAn6CbiaOcHRw/exec';
/* ========================================================================== */
const ONLINE=!!API,LS='kicker_tg_cache',K=32,BASE=1000,COLLS=['players','matches','sessions','tours'];
const blank=()=>({players:[],matches:[],sessions:[],tours:[]});
const strip=o=>JSON.stringify(o,(k,v)=>k[0]==='_'?undefined:v);
function load(){try{const t=localStorage.getItem(LS);if(t)return Object.assign(blank(),JSON.parse(t))}catch(e){}return blank()}
function cacheLocal(){try{localStorage.setItem(LS,strip(S))}catch(e){}}
let LOADED=!ONLINE,SNAP={},Q=[],FT=null,FLUSHING=false,SYNC='',NEEDRENDER=false;
function snapAll(){SNAP={};COLLS.forEach(c=>{SNAP[c]={};S[c].forEach(o=>SNAP[c][o.id]=strip(o))})}
function save(){cacheLocal();if(!ONLINE)return;
  COLLS.forEach(c=>{const seen={};SNAP[c]=SNAP[c]||{};
    S[c].forEach(o=>{const j=strip(o);seen[o.id]=1;if(SNAP[c][o.id]!==j){SNAP[c][o.id]=j;Q=Q.filter(q=>!(q.c===c&&q.id===o.id));Q.push({op:'put',c,id:o.id,obj:JSON.parse(j)})}});
    Object.keys(SNAP[c]).forEach(id=>{if(!seen[id]){delete SNAP[c][id];Q=Q.filter(q=>!(q.c===c&&q.id===id));Q.push({op:'del',c,id})}})});
  if(Q.length){setSync('wait');clearTimeout(FT);FT=setTimeout(flush,400)}}
async function api(body){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({...body,initData:INITF()})});return r.json()}
async function flush(){if(FLUSHING||!Q.length)return;FLUSHING=true;const ops=Q.slice();let retry=false;
  try{const j=await api({action:'sync',ops});if(!j.ok)throw new Error(j.error);Q=Q.filter(q=>!ops.includes(q));setSync(Q.length?'wait':'ok')}
  catch(e){const a=e.message==='auth';setSync(a?'auth':'err');retry=!a}
  finally{FLUSHING=false;if(retry)setTimeout(flush,5000);else if(Q.length)flush()}}
async function pull(force){if(!ONLINE||Q.length||FLUSHING)return;
  try{if(force)setSync('wait');const r=await fetch(API+'?action=state');const j=await r.json();if(!j.ok)throw 0;if(Q.length||FLUSHING)return;
    const nd=Object.assign(blank(),j.data);
    const changed=COLLS.some(c=>nd[c].length!==Object.keys(SNAP[c]||{}).length||nd[c].some(o=>(SNAP[c]||{})[o.id]!==strip(o)));
    setSync('ok');const first=!LOADED;LOADED=true;if(!changed){if(first)render();return}S=nd;snapAll();cacheLocal();
    const ae=document.activeElement;if(!first&&(MODALFN||(ae&&/INPUT|TEXTAREA|SELECT/.test(ae.tagName)&&!force)))NEEDRENDER=true;else render()}
  catch(e){setSync('err');if(!LOADED){LOADED=true;render()}}}
function setSync(s){SYNC=s;const el=document.getElementById('sync');if(el)el.textContent=ONLINE?({ok:'☁️',wait:'⏳',err:'⚠️ нет связи',auth:'⛔ откройте через Telegram'}[s]||''):'📱 локально'}
function hashInit(){try{return new URLSearchParams((window.__H||'').slice(1)).get('tgWebAppData')||''}catch(e){return''}}
const INITF=()=>(window.Telegram&&Telegram.WebApp&&Telegram.WebApp.initData)||hashInit();
function TGU(){try{const u=new URLSearchParams(INITF()).get('user');return u?JSON.parse(u):null}catch(e){return null}}
const meP=()=>{const u=TGU();return u?S.players.find(p=>p.tg===u.id):null};
let S=load(),TAB='rating',SEL=new Set(),SHOWG=true,TMODE='teams',FORM={tper:3,ppos:'any'},CONFIRM=null,MODALFN=null,C={R:{},st:{}};
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const P=id=>S.players.find(p=>p.id===id);
const nm=id=>{const p=P(id);return p?p.name+(p.guest?' 👤':''):'?'};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const avg=a=>a.reduce((x,y)=>x+y,0)/a.length;
const ex=(ra,rb)=>1/(1+Math.pow(10,(rb-ra)/400));
const pct=(w,g)=>g?Math.round(100*w/g)+'%':'—';
const sg=d=>`<span class="${d>=0?'pos':'neg'}">${d>=0?'+':''}${Math.round(d)}</span>`;
const fmtDate=ts=>new Date(ts).toLocaleDateString('ru-RU',{day:'numeric',month:'short'});
const POS={any:'Универсал',atk:'Атака',def:'Защита'};
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

/* ---------- расчёт рейтинга и статистики ---------- */
function calc(){
  const R={},st={};
  const get=id=>st[id]||(st[id]={g:0,w:0,l:0,ag:0,aw:0,dg:0,dw:0,gf:0,ga:0,streak:0,best:0,part:{},hist:[],pg:0,pgn:0,pbest:0});
  S.players.forEach(p=>{R[p.id]=BASE;get(p.id)});
  const ms=[...S.matches].sort((x,y)=>x.ts-y.ts);
  for(const m of ms){
    [...m.a,...m.b].forEach(id=>{if(R[id]==null)R[id]=BASE});
    const ea=ex(avg(m.a.map(i=>R[i])),avg(m.b.map(i=>R[i])));
    const d=K*((m.sa>m.sb?1:0)-ea);m._d=d;m._ea=ea;
    side(m.a,m.sa,m.sb,d,m);side(m.b,m.sb,m.sa,-d,m);
  }
  function side(team,f,a,d,m){const won=f>a;team.forEach((id,i)=>{R[id]+=d;const s=get(id);s.g++;if(m.g&&m.g[id]!=null){const v=+m.g[id];s.pg+=v;s.pgn++;s.pbest=Math.max(s.pbest,v)}won?s.w++:s.l++;s.gf+=f;s.ga+=a;
    s.streak=won?(s.streak>0?s.streak+1:1):(s.streak<0?s.streak-1:-1);s.best=Math.max(s.best,s.streak);
    if(team.length===2){if(i===0){s.ag++;if(won)s.aw++}else{s.dg++;if(won)s.dw++}
      const pp=s.part[team[1-i]]||(s.part[team[1-i]]={g:0,w:0});pp.g++;if(won)pp.w++}
    s.hist.push(Math.round(R[id]))})}
  return{R,st};
}
function lean(s){if(!s)return null;const a=s.ag>=2?s.aw/s.ag:null,d=s.dg>=2?s.dw/s.dg:null;
  if(a==null&&d==null)return null;if(d==null)return{i:'⚔️',t:'Играет в атаке'};if(a==null)return{i:'🛡',t:'Играет в защите'};
  if(Math.abs(a-d)<.1)return{i:'⚖️',t:'Универсал: одинаково в атаке и защите'};
  return a>d?{i:'⚔️',t:'Сильнее в атаке'}:{i:'🛡',t:'Сильнее в защите'}}

/* ---------- подбор игр ---------- */
function posScore(id,role){const p=P(id)||{},s=C.st[id]||{};let v=0;if(p.pos===role)v+=2;else if(p.pos&&p.pos!=='any')v-=2;
  const a=s.ag?s.aw/s.ag:.5,d=s.dg?s.dw/s.dg:.5;return v+(role==='atk'?a-d:d-a)}
function posAssign(t){if(t.length<2)return t;const[x,y]=t;return posScore(x,'atk')+posScore(y,'def')>=posScore(y,'atk')+posScore(x,'def')?[x,y]:[y,x]}
const sameSet=(x,y)=>x.length===y.length&&x.every(i=>y.includes(i));
function pickNext(ids,ms,div){
  const n=ids.length;if(n<2)return null;const games={},last={};ids.forEach(i=>{games[i]=0;last[i]=-1});
  ms.forEach((m,k)=>[...m.a,...m.b].forEach(i=>{if(i in games){games[i]++;last[i]=k}}));
  const order=shuffle(ids).sort((x,y)=>games[x]-games[y]||last[x]-last[y]);
  if(n<4)return{a:[order[0]],b:[order[1]]};
  const f=order.slice(0,4),R=C.R;
  const together=(x,y)=>ms.filter(m=>(m.a.includes(x)&&m.a.includes(y))||(m.b.includes(x)&&m.b.includes(y))).length;
  const lm=ms[ms.length-1];let best=null,bs=1e9;
  for(const[ta,tb]of[[[0,1],[2,3]],[[0,2],[1,3]],[[0,3],[1,2]]]){
    const A=ta.map(i=>f[i]),B=tb.map(i=>f[i]);
    let sc=Math.abs(avg(A.map(i=>R[i]??BASE))-avg(B.map(i=>R[i]??BASE)))+div*(together(...A)+together(...B))+Math.random()*5;
    if(lm&&((sameSet(lm.a,A)&&sameSet(lm.b,B))||(sameSet(lm.a,B)&&sameSet(lm.b,A))))sc+=80;
    if(sc<bs){bs=sc;best={a:A,b:B}}}
  return{a:posAssign(best.a),b:posAssign(best.b)};
}
const ctxMatches=(t,id)=>S.matches.filter(m=>m.ctx&&m.ctx.t===t&&m.ctx.id===id).sort((x,y)=>x.ts-y.ts);
function ensureCur(o,own,div){if(!o.cur){o.cur=pickNext(o.ids,ctxMatches(own,o.id),div);save()}}
function ctxTable(t,id,ids){const s={};ids.forEach(i=>s[i]={g:0,w:0,d:0,gd:0,pg:0,pgn:0});
  ctxMatches(t,id).forEach(m=>[[m.a,m.sa,m.sb,m._d],[m.b,m.sb,m.sa,-m._d]].forEach(([tm,f,a,d])=>tm.forEach(i=>{const x=s[i]||(s[i]={g:0,w:0,d:0,gd:0,pg:0,pgn:0});x.g++;if(f>a)x.w++;x.d+=d;x.gd+=f-a;if(m.g&&m.g[i]!=null){x.pg+=+m.g[i];x.pgn++}})));
  return Object.entries(s).map(([id,x])=>({id,...x}))}
function mvp(tb){const c=tb.filter(x=>x.g>=2);const l=(c.length?c:tb.filter(x=>x.g)).sort((x,y)=>y.d-x.d);return l[0]}


/* ---------- номинации ---------- */
const RULES=[
 {k:'run',e:'🚀',n:['Неудержимый','Терминатор','Машина для побед'],ok:x=>(x.w===x.g&&x.g>=3)||x.maxRun>=4,sc:x=>x.maxRun*10+x.w,d:x=>`${x.w} из ${x.g} побед, серия ${x.maxRun}`},
 {k:'pgoal',e:'⚽',n:['Бомбардир','Голеадор','Машина для голов'],ok:x=>x.pgn>=2&&x.pg/x.pgn>=3,sc:x=>x.pg/x.pgn,d:x=>`забил ${x.pg}, ${(x.pg/x.pgn).toFixed(1)} за игру`},
 {k:'wall',e:'🧱',n:['Каменная стена','Великая китайская стена','Вратарь от бога'],ok:x=>x.dg>=2&&x.dga/x.dg<=5,sc:x=>-x.dga/x.dg,d:x=>`в защите пропускал в среднем ${(x.dga/x.dg).toFixed(1)}`},
 {k:'snip',e:'🎯',n:['Снайпер','Пушка','Бомбардир'],ok:x=>x.ag>=2&&x.agf/x.ag>=7,sc:x=>x.agf/x.ag,d:x=>`в атаке ${(x.agf/x.ag).toFixed(1)} гола за игру`},
 {k:'dry',e:'🫣',n:['Под стол!','Сухарист','Безжалостный'],ok:x=>x.dry>0,sc:x=>x.dry,d:x=>`сухих побед: ${x.dry}`},
 {k:'up',e:'⚡',n:['Гроза фаворитов','Давид против Голиафа','Ломатель прогнозов'],ok:x=>x.up>0,sc:x=>x.up,d:x=>`побед вопреки прогнозу: ${x.up}`},
 {k:'uni',e:'🔄',n:['Универсальный солдат','Швейцарский нож','Двуликий'],ok:x=>x.aw>0&&x.dw>0,sc:x=>x.aw+x.dw,d:()=>'выигрывал и в атаке, и в защите'},
 {k:'iron',e:'🦾',n:['Железный человек','Абонемент на кикер','Не отходил от стола'],ok:x=>x.g>=4,sc:x=>x.g,d:x=>`${x.g} игр`},
 {k:'close',e:'😬',n:['Почти смог','Чуть-чуть не хватило','Мастер нервных концовок','В следующий раз'],ok:x=>x.close>=2,sc:x=>x.close,d:x=>`проигрывал в 1–2 гола: ${x.close} раза`},
 {k:'train',e:'🏋️',n:['Надо ещё потренить','Разминался весь вечер','Главное — участие','Р — разочарование','Может, ты хорош в чём-то другом? Попробуй оригами','Зато ты красивый(ая)'],ok:x=>x.w===0&&x.g>=2,sc:x=>x.g,d:x=>`0 побед из ${x.g}. Реванш на следующей неделе!`},
 {k:'sieve',e:'🕳️',n:['Дырявое сито','Проходной двор','Гостеприимный вратарь','Даже моя одноклассница Маша меньше пропускала'],ok:x=>x.dg>=2&&x.dga/x.dg>=8,sc:x=>x.dga/x.dg,d:x=>`в защите пропускал ${(x.dga/x.dg).toFixed(1)} за игру`},
 {k:'mid',e:'⚖️',n:['Мистер стабильность','Золотая середина','Ни туда ни сюда'],ok:x=>x.g>=2&&x.w*2===x.g,sc:x=>x.g,d:x=>`${x.w} побед и ${x.g-x.w} поражений`},
 {k:'any',e:'🎲',n:['Душа компании','Человек-загадка','Тихий убийца'],ok:x=>x.g>0,sc:x=>x.w,d:x=>`${x.w} из ${x.g} побед`}];
const MVPP=['Был бы я не приложением, я бы тебе дал','Остальным можно расходиться','Автографы — после игры'];
const mvpPh=o=>MVPP[hsh(o.id+'mvp'+(o.seed||0))%MVPP.length];
const hsh=str=>{let h=0;for(const c of str)h=(h*31+c.charCodeAt(0))|0;return Math.abs(h)};
function awards(t,o){const s={},g=i=>s[i]||(s[i]={id:i,pg:0,pgn:0,g:0,w:0,ag:0,agf:0,aw:0,dg:0,dga:0,dw:0,dry:0,up:0,close:0,run:0,maxRun:0});
  ctxMatches(t,o.id).forEach(m=>[[m.a,m.sa,m.sb,m._ea],[m.b,m.sb,m.sa,1-m._ea]].forEach(([tm,f,a,ch])=>tm.forEach((i,j)=>{const x=g(i),won=f>a;x.g++;if(m.g&&m.g[i]!=null){x.pg+=+m.g[i];x.pgn++}
    if(won){x.w++;x.run++;x.maxRun=Math.max(x.maxRun,x.run);if(a===0)x.dry++;if(ch<.4)x.up++}else{x.run=0;if(a-f<=2)x.close++}
    if(tm.length===2){if(j===0){x.ag++;x.agf+=f;if(won)x.aw++}else{x.dg++;x.dga+=a;if(won)x.dw++}}})));
  const pl=Object.values(s),used=new Set(),out=[];
  for(const r of RULES){const c=pl.filter(x=>!used.has(x.id)&&r.ok(x)).sort((a,b)=>r.sc(b)-r.sc(a));
    const take=r.k==='any'?c:c.slice(0,1);
    take.forEach(x=>{used.add(x.id);out.push({id:x.id,e:r.e,t:r.n[hsh(o.id+r.k+x.id+(o.seed||0))%r.n.length],d:r.d(x)})})}
  return out}

  const ms=S.matches.filter(m=>m.a.includes(id)||m.b.includes(id)).sort((a,b)=>b.ts-a.ts).slice(0,6);
  const v=[BASE,...s.hist],mn=Math.min(...v),mx=Math.max(...v),rg=mx-mn||1;
  const spark=v.length>1?`<svg viewBox="0 0 300 60" class="spark" preserveAspectRatio="none"><polyline points="${v.map((y,i)=>`${(i/(v.length-1)*300).toFixed(1)},${(56-(y-mn)/rg*52).toFixed(1)}`).join(' ')}" fill="none" stroke="#3ddc84" stroke-width="2"/></svg>`:'';
  return`<div class="row between"><h2 style="margin:0">${esc(nm(id))}</h2><button class="mini" data-act="editPlayer" data-id="${id}">✏️</button></div>
  ${(()=>{const u=TGU();if(!u)return'';if(p.tg===u.id)return'<p><span class="tag">это ваш профиль</span> <button class="mini" data-act="unme" data-id="'+id+'">отвязать</button></p>';if(!p.tg&&!meP())return'<button class="mini" data-act="itsme" data-id="'+id+'">🙋 Это я</button>';return''})()}
  <p class="muted">Любимая позиция: ${POS[p.pos||'any']}${p.guest?'<span class="tag">гость</span>':''}${p.note?'<br>'+esc(p.note):''}</p>
  <div class="grid"><div class="stat"><b>${Math.round(C.R[id])}</b><span>рейтинг</span></div><div class="stat"><b>${s.g}</b><span>игр</span></div><div class="stat"><b>${pct(s.w,s.g)}</b><span>побед</span></div>
  <div class="stat"><b>${s.w}/${s.l}</b><span>В / П</span></div><div class="stat"><b>${pct(s.aw,s.ag)}</b><span>⚔️ атака (${s.ag})</span></div><div class="stat"><b>${pct(s.dw,s.dg)}</b><span>🛡 защита (${s.dg})</span></div></div>
  ${s.pgn?`<div class="grid"><div class="stat"><b>${s.pg}</b><span>⚽ голов (${s.pgn} игр)</span></div><div class="stat"><b>${(s.pg/s.pgn).toFixed(1)}</b><span>в среднем за игру</span></div><div class="stat"><b>${s.pbest}</b><span>рекорд за игру</span></div></div>`:''}
  ${spark}
  <p>${l?l.i+' '+l.t:'Склонность появится после пары игр в каждой позиции'}</p>
  <p class="muted">Серия: ${s.streak>0?'🔥 '+s.streak+' побед подряд':s.streak<0?Math.abs(s.streak)+' пораж. подряд':'—'} · рекорд: ${s.best}<br>
  ${bp?`Лучший напарник: <b>${esc(nm(bp.pid))}</b> (${bp.w} из ${bp.g})<br>`:''}${fp?`Чаще всего играет с: ${esc(nm(fp.pid))} (${fp.g})`:''}</p>
  ${ms.length?`<h3>Последние игры</h3>${ms.map(m=>`<div class="game">${gameLine(m)}</div>`).join('')}`:''}
  <button class="btn ghost" data-act="closeModal">Закрыть</button>`}
function editHTML(id){const p=P(id),used=S.matches.some(m=>m.a.includes(id)||m.b.includes(id));
  return`<h2>Редактировать</h2><label>Имя<input id="ep_name" value="${esc(p.name)}"></label><label>Пара слов о себе<input id="ep_note" value="${esc(p.note)}" placeholder="например: левша, кручу"></label>
  <label>Любимая позиция<select id="ep_pos">${Object.entries(POS).map(([k,v])=>`<option value="${k}" ${p.pos===k?'selected':''}>${v}</option>`).join('')}</select></label>
  <label class="tog"><input type="checkbox" id="ep_g" ${p.guest?'checked':''}> Гость</label>
  <button class="btn" data-act="savePlayer" data-id="${id}">Сохранить</button>
  ${used?'<p class="hint">У игрока есть игры, поэтому удалить нельзя. Можно оставить его гостем и скрыть гостей в рейтинге.</p>':`<button class="btn danger" data-act="delPlayer" data-id="${id}">Удалить</button>`}`}
function summaryHTML(kind,o){let txt,html;
  if(kind==='s'){const tb=ctxTable('s',o.id,o.ids).filter(x=>x.g).sort((x,y)=>y.d-x.d),m=mvp(tb);
    html=`<h2>Итоги вечера · ${fmtDate(o.ts)}</h2>${m?`<div class="banner">🏆 Лучший игрок вечера<b>${esc(nm(m.id))}</b>${m.w} побед из ${m.g} · рейтинг ${Math.round(m.d)>=0?'+':''}${Math.round(m.d)}<small style="margin-top:6px;font-style:italic">«${mvpPh(o)}»</small></div>`:''}${(()=>{const t=topScorer(tb);return t?`<p>⚽ Бомбардир вечера: <b>${esc(nm(t.id))}</b> — ${t.pg} гол(ов) за ${t.pgn} игр</p>`:''})()}${awardsHTML('s',o)}${tableHTML(tb,'Таблица')}`;
    txt=`⚽ Кикер · ${fmtDate(o.ts)}\n${m?'🏆 Лучший игрок: '+nm(m.id)+' — «'+mvpPh(o)+'»\n':''}`+tb.map((x,i)=>`${i+1}. ${nm(x.id)} — ${x.w}/${x.g}, ${x.d>=0?'+':''}${Math.round(x.d)}`).join('\n')+(topScorer(tb)?'\n⚽ Бомбардир: '+nm(topScorer(tb).id)+' — '+topScorer(tb).pg:'')+'\n\n'+awardsTxt('s',o)}
  else{const tb=ctxTable('t',o.id,o.ids).filter(x=>x.g).sort((x,y)=>y.d-x.d),m=mvp(tb);
    html=`<h2>${esc(o.name)}</h2><div class="banner">🏆 ${o.mode==='teams'?'Чемпионы':'Победитель'}<b>${champ(o)}</b></div>${m?`<p>⭐ Лучший игрок турнира: <b>${esc(nm(m.id))}</b> (рейтинг ${sg(m.d)})<br><i class="muted">«${mvpPh(o)}»</i></p>`:''}${(()=>{const t=topScorer(tb);return t?`<p>⚽ Бомбардир турнира: <b>${esc(nm(t.id))}</b> — ${t.pg}</p>`:''})()}${awardsHTML('t',o)}${tableHTML(tb,'Личная статистика')}`;
    txt=`🎯 ${o.name} · ${fmtDate(o.ts)}\n🏆 ${champ(o).replace(/&amp;/g,'&')}\n${m?'⭐ Лучший игрок: '+nm(m.id)+' — «'+mvpPh(o)+'»':''}\n\n${awardsTxt('t',o)}`}
  return html+`<textarea rows="5" readonly id="sumtxt">${esc(txt)}</textarea>${ONLINE?'<button class="btn ghost" data-act="sendSum">📤 Отправить итоги в чат</button>':''}<button class="btn ghost" data-act="copySum">📋 Скопировать итоги</button><button class="btn" data-act="closeModal">Готово</button>`}

/* ---------- действия ---------- */
function render(){if(!LOADED){document.getElementById('app').innerHTML='<div class="empty">⏳ Загружаю данные…</div>';return}C=calc();document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab===TAB));
  const s=activeSession(),t=activeTour();document.getElementById('sub').textContent=[s?'идёт вечер':'',t?'идёт турнир':''].filter(Boolean).join(' · ');
  document.getElementById('app').innerHTML={rating:vRating,session:vSession,tour:vTour,players:vPlayers,more:vMore}[TAB]()}
function openModal(fn){MODALFN=fn;document.getElementById('sheet').innerHTML=fn();document.getElementById('modal').classList.remove('hidden')}
function refresh(){C=calc();if(MODALFN)document.getElementById('sheet').innerHTML=MODALFN();else render()}
function closeModal(){MODALFN=null;document.getElementById('modal').classList.add('hidden');render()}
const getOwner=o=>o==='s'?activeSession():activeTour();
const err=(id,t)=>{const e=document.getElementById(id);if(e)e.textContent=t};
function addP(name,g,pos){const p={id:uid(),name:name.trim(),pos:pos||'any',guest:!!g,ts:Date.now()};S.players.push(p);return p}
function pairs(ids,mode){let l=mode==='r'?[...ids].sort((a,b)=>(C.R[b]??BASE)-(C.R[a]??BASE)):shuffle(ids);const out=[];
  if(mode==='r'){while(l.length)out.push(posAssign([l.shift(),l.pop()]))}else for(let i=0;i<l.length;i+=2)out.push(posAssign([l[i],l[i+1]]));return out}
function seeding(n){let s=[1,2];while(s.length<n){const m=s.length*2;s=s.flatMap(x=>[x,m+1-x])}return s}
function adv(t,r,i){if(r+1>=t.br.length)return;const nx=t.br[r+1][i>>1];if(i%2===0)nx.a=t.br[r][i].w;else nx.b=t.br[r][i].w}
function buildBracket(t){const T=t.teams.length,seed=t.teams.map((_,i)=>i).sort((x,y)=>teamR(t.teams[y])-teamR(t.teams[x]));
  let n=1;while(n<T)n*=2;const sd=seeding(n),r0=[];
  for(let i=0;i<n;i+=2)r0.push({a:sd[i]<=T?seed[sd[i]-1]:null,b:sd[i+1]<=T?seed[sd[i+1]-1]:null,w:null});
  t.br=[r0];for(let k=n/2;k>1;){k/=2;t.br.push(Array.from({length:k},()=>({a:null,b:null,w:null})))}
  r0.forEach((m,i)=>{if((m.a==null)!==(m.b==null)){m.w=m.a??m.b;adv(t,0,i)}})}

const A={
  tab:e=>{TAB=e.dataset.tab;CONFIRM=null;render();scrollTo(0,0)},
  chip:e=>{const id=e.dataset.id;SEL.has(id)?SEL.delete(id):SEL.add(id);refresh()},
  quickAdd:e=>{const n=(FORM.qname||'').trim();if(!n)return;const p=addP(n,e.dataset.g==='1');SEL.add(p.id);FORM.qname='';save();refresh()},
  startSession:()=>{if(SEL.size<2)return err('err_new','Выберите хотя бы двух игроков');
    S.sessions.push({id:uid(),ts:Date.now(),host:(FORM.host||'').trim(),ids:[...SEL],open:true,cur:null});SEL.clear();save();render()},
  editRoster:()=>{const s=activeSession();SEL=new Set(s.ids);openModal(()=>`<h2>Состав на вечер</h2>${chipsHTML()}<button class="btn" data-act="applyRoster">Применить (${SEL.size})</button>`)},
  applyRoster:()=>{const s=activeSession();s.ids=[...SEL];s.cur=null;SEL.clear();save();closeModal()},
  regen:e=>{const o=getOwner(e.dataset.own);o.cur=pickNext(o.ids,ctxMatches(e.dataset.own,o.id),e.dataset.own==='s'?15:40);save();render()},
  swap:e=>{const o=getOwner(e.dataset.own);o.cur[e.dataset.k].reverse();save();render()},
  saveRes:e=>{const own=e.dataset.own,o=getOwner(own),c=o.cur,sa=parseInt(c.sa),sb=parseInt(c.sb),all=[...c.a,...c.b];
    if(isNaN(sa)||isNaN(sb)||sa<0||sb<0)return err('err_'+own,'Введите счёт обеих команд');
    if(sa===sb)return err('err_'+own,'Ничьей быть не может — проверьте счёт');
    if(new Set(all).size!==all.length)return err('err_'+own,'Один игрок указан дважды');
    let g=null;if(o.pg&&c.g){g={};for(const i of all){const v=c.g[i];if(v!==undefined&&v!==''){const n=parseInt(v);if(isNaN(n)||n<0)return err('err_'+own,'Проверьте голы игроков');g[i]=n}}
      const sum=t=>t.reduce((x,i)=>x+(g[i]||0),0);if(sum(c.a)>sa||sum(c.b)>sb)return err('err_'+own,'У игроков голов больше, чем счёт команды');if(!Object.keys(g).length)g=null}
    const m={id:uid(),ts:Date.now(),ctx:{t:own,id:o.id},a:[...c.a],b:[...c.b],sa,sb,host:o.host||''};if(g)m.g=g;S.matches.push(m);
    if(c.bm){const[r,i]=c.bm,bm=o.br[r][i];bm.w=sa>sb?bm.a:bm.b;bm.mid=m.id;bm.sc=sa+':'+sb;adv(o,r,i)}
    o.cur=null;save();render()},
  undo:e=>{S.matches=S.matches.filter(m=>m.id!==e.dataset.id);save();render()},
  endSession:()=>{const s=activeSession();s.open=false;s.cur=null;s.end=Date.now();save();
    if(!ctxMatches('s',s.id).length){S.sessions=S.sessions.filter(x=>x!==s);save();return render()}C=calc();openModal(()=>summaryHTML('s',s))},
  sumSession:e=>openModal(()=>summaryHTML('s',S.sessions.find(x=>x.id===e.dataset.id))),
  tmode:e=>{TMODE=e.dataset.m;render()},
  createTour:()=>{const n=SEL.size;if(n<4)return err('err_new','Нужно минимум 4 игрока');
    if(TMODE==='teams'&&n%2)return err('err_new',`Игроков ${n} — нечётное число. Добавьте гостя или выберите «Каждый сам за себя».`);
    const t={id:uid(),ts:Date.now(),name:(FORM.tname||'').trim()||'Турнир '+fmtDate(Date.now()),host:(FORM.host||'').trim(),ids:[...SEL],mode:TMODE,open:true,cur:null};
    if(TMODE==='teams'){t.stage='setup';t.teams=pairs(t.ids,'r')}else{t.stage='run';t.G=Math.max(1,Math.ceil(n*Math.max(1,parseInt(FORM.tper)||3)/4))}
    S.tours.push(t);SEL.clear();FORM.tname='';save();render()},
  autoTeams:e=>{const t=activeTour();t.teams=pairs(t.ids,e.dataset.m);save();render()},
  launch:()=>{const t=activeTour(),all=t.teams.flat();if(new Set(all).size!==all.length){alertBox('Один игрок стоит в двух командах');return}
    buildBracket(t);t.stage='run';save();render()},
  cancelTour:()=>{const t=activeTour();S.tours=S.tours.filter(x=>x!==t);save();render()},
  playBr:e=>{const t=activeTour(),r=+e.dataset.r,i=+e.dataset.i,m=t.br[r][i];
    t.cur={a:posAssign([...t.teams[m.a]]),b:posAssign([...t.teams[m.b]]),fixed:true,bm:[r,i],title:rn(r,t.br.length)};save();render();scrollTo(0,0)},
  closeBr:()=>{activeTour().cur=null;save();render()},
  brUndo:e=>{const t=activeTour(),r=+e.dataset.r,i=+e.dataset.i,m=t.br[r][i];
    if(r+1<t.br.length){const nx=t.br[r+1][i>>1];if(nx.w!=null)return;if(i%2===0)nx.a=null;else nx.b=null;if(t.cur&&t.cur.bm&&t.cur.bm[0]===r+1)t.cur=null}
    S.matches=S.matches.filter(x=>x.id!==m.mid);m.w=null;m.mid=null;m.sc=null;save();render()},
  moreGames:()=>{activeTour().G++;save();render()},
  endTour:()=>{const t=activeTour();t.open=false;t.cur=null;t.end=Date.now();save();
    if(!ctxMatches('t',t.id).length){S.tours=S.tours.filter(x=>x!==t);save();return render()}C=calc();openModal(()=>summaryHTML('t',t))},
  sumTour:e=>openModal(()=>summaryHTML('t',S.tours.find(x=>x.id===e.dataset.id))),
  addPlayer:()=>{const n=(FORM.pname||'').trim();if(!n)return err('err_p','Введите имя');
    if(S.players.some(p=>p.name.toLowerCase()===n.toLowerCase()))return err('err_p','Такое имя уже есть');
    addP(n,FORM.pguest,FORM.ppos);FORM.pname='';FORM.pguest=false;save();render()},
  profile:e=>openModal(()=>profileHTML(e.dataset.id)),
  editPlayer:e=>openModal(()=>editHTML(e.dataset.id)),
  savePlayer:e=>{const p=P(e.dataset.id),n=document.getElementById('ep_name').value.trim();if(n)p.name=n;
    p.note=document.getElementById('ep_note').value.trim();p.pos=document.getElementById('ep_pos').value;p.guest=document.getElementById('ep_g').checked;save();closeModal()},
  delPlayer:e=>{S.players=S.players.filter(p=>p.id!==e.dataset.id);save();closeModal()},
  closeModal:()=>closeModal(),
  smode:e=>{const s=activeSession();s.manual=e.dataset.m==='manual';if(!s.manual)s.cur=null;save();render()},
  togpg:e=>{const o=getOwner(e.dataset.own);o.pg=!o.pg;save();render()},
  fmt:e=>{const o=getOwner(e.dataset.own),c=o.cur;if(c.a.length===2){c.a=[c.a[0]];c.b=[c.b[0]]}else{const on=new Set([...c.a,...c.b]),r=o.ids.filter(i=>!on.has(i));if(r.length<2)return;c.a.push(r[0]);c.b.push(r[1])}c.g={};save();render()},
  pullNow:()=>{if(ONLINE)pull(true);else render()},
  itsme:e=>{const u=TGU();if(!u)return;P(e.dataset.id).tg=u.id;save();refresh()},
  unme:e=>{delete P(e.dataset.id).tg;save();refresh()},
  sendSum:async e=>{e.disabled=true;e.textContent='Отправляю…';try{const j=await api({action:'send',text:document.getElementById('sumtxt').value});flash(j.ok?'Отправлено в чат':(j.error||'Не получилось'))}catch(x){flash('Нет связи')}e.disabled=false;e.textContent='📤 Отправить итоги в чат'},
  reroll:e=>{const o=(e.dataset.kind==='s'?S.sessions:S.tours).find(x=>x.id===e.dataset.id);o.seed=(o.seed||0)+1;save();refresh()},
  copyExp:()=>copy(document.getElementById('exp').value),
  copySum:()=>copy(document.getElementById('sumtxt').value),
  import:()=>{try{const d=JSON.parse(document.getElementById('imp').value);if(!Array.isArray(d.players)||!Array.isArray(d.matches))throw 0;S=Object.assign(blank(),d);save();TAB='rating';render()}catch(x){err('err_imp','Не получилось прочитать копию')}},
  demo:()=>{const names=[['Гор','any'],['Артём','atk'],['Саша','def'],['Миша','atk'],['Дима','any'],['Лёша','def'],['Костя','atk']];
    const ids=names.map(([n,p])=>(S.players.find(x=>x.name===n)||addP(n,false,p)).id);const skill={};ids.forEach((i,k)=>skill[i]=[1.3,1.1,1,1.2,.8,.9,.7][k]);
    let ts=Date.now()-30*864e5;for(let k=0;k<30;k++){const f=shuffle(ids).slice(0,4),a=[f[0],f[1]],b=[f[2],f[3]];
      const pa=(skill[a[0]]+skill[a[1]])/(skill[a[0]]+skill[a[1]]+skill[b[0]]+skill[b[1]]),win=Math.random()<pa,lo=Math.floor(Math.random()*9);
      S.matches.push({id:uid(),ts:ts+=864e5,ctx:{t:'demo',id:'demo'},a,b,sa:win?10:lo,sb:win?lo:10,host:'демо'})}
    save();TAB='rating';render()},
  reset:()=>{if(CONFIRM!=='reset'){CONFIRM='reset';return render()}S=blank();CONFIRM=null;save();render()}
};
const CH={
  showg:e=>{SHOWG=e.checked;render()},
  setto:e=>{const o=getOwner(e.dataset.own);o.to=+e.value;save()},
  setpos:e=>{const o=getOwner(e.dataset.own),c=o.cur,k=e.dataset.k,j=+e.dataset.j,nv=e.value,old=c[k][j];
    for(const kk of['a','b'])c[kk].forEach((x,jj)=>{if(x===nv)c[kk][jj]=old});c[k][j]=nv;save();render()},
  setteam:e=>{const t=activeTour(),ti=+e.dataset.ti,j=+e.dataset.j,nv=e.value,old=t.teams[ti][j];
    t.teams.forEach(tm=>tm.forEach((x,jj)=>{if(x===nv)tm[jj]=old}));t.teams[ti][j]=nv;save();render()}
};
function copy(t){try{navigator.clipboard.writeText(t).then(()=>flash('Скопировано'),()=>flash('Выделите текст и скопируйте вручную'))}catch(x){flash('Выделите текст и скопируйте вручную')}}
function flash(t){const d=document.createElement('div');d.textContent=t;d.style.cssText='position:fixed;top:14px;left:50%;transform:translateX(-50%);background:#3ddc84;color:#04210f;padding:8px 14px;border-radius:10px;z-index:20;font-weight:600';document.body.appendChild(d);setTimeout(()=>d.remove(),1600)}
function alertBox(t){flash(t)}
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(el){const f=A[el.dataset.act];if(f)f(el);return}if(e.target.id==='modal')closeModal()});
document.addEventListener('input',e=>{const el=e.target;if(el.dataset.f)FORM[el.dataset.f]=el.type==='checkbox'?el.checked:el.value;
  if(el.dataset.pg){const o=getOwner(el.dataset.own);if(o&&o.cur){o.cur.g=o.cur.g||{};if(el.value==='')delete o.cur.g[el.dataset.pg];else o.cur.g[el.dataset.pg]=el.value;save()}}
  if(el.dataset.sc){const o=getOwner(el.dataset.own);if(o&&o.cur){const k=el.dataset.sc,ok=k==='a'?'b':'a',v=parseInt(el.value);o.cur['s'+k]=el.value;
    const other=document.querySelector(`[data-sc="${ok}"][data-own="${el.dataset.own}"]`);
    const to=String(o.to||10);if(v>=0&&v<+to&&other&&other.value===''){other.value=to;o.cur['s'+ok]=to}save()}}});
document.addEventListener('change',e=>{const el=e.target;if(el.dataset.chg&&CH[el.dataset.chg])CH[el.dataset.chg](el)});
snapAll();render();setSync(ONLINE?'wait':'');
window.addEventListener('load',()=>{const w=window.Telegram&&Telegram.WebApp;if(w){try{w.ready();w.expand();w.setHeaderColor('#0f1115');w.setBackgroundColor('#0f1115')}catch(e){}}render()});
if(ONLINE){pull(true);setInterval(()=>{if(!document.hidden)pull()},15000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)pull()})}
document.addEventListener('focusout',()=>setTimeout(()=>{if(NEEDRENDER&&!MODALFN&&!/INPUT|TEXTAREA|SELECT/.test((document.activeElement||{}).tagName||'')){NEEDRENDER=false;render()}},50));
